name: Build macOS DMG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install dependencies and compile
      run: |
        npm install
        # Add your project compilation steps here

    - name: Run Build and Sign Script
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OceanaLauncher-DMG
        path: dist/*.dmg
