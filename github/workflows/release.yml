name: Build and Package macOS App

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Compile macOS App
      run: |
        xcodebuild -project CustomLauncher.xcodeproj \
                   -scheme CustomLauncher \
                   -configuration Release \
                   -derivedDataPath build \
                   build

    - name: Install create-dmg tool
      run: brew install create-dmg

    - name: Package into DMG
      run: |
        mkdir -p dist
        cp -R build/Build/Products/Release/CustomLauncher.app dist/
        create-dmg \
          --volname "Launcher Installer" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "CustomLauncher.dmg" \
          "dist/"

    - name: Upload DMG to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: CustomLauncher.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
